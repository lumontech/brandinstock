# Stack di produzione per VPS (Contabo): Caddy (HTTPS) → PHP-FPM (Laravel) → PostgreSQL.
# Solo Caddy espone porte; database e app sono su reti Docker interne senza accesso dall'esterno.
name: brandinstock-crm

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

x-app-env: &app-env
  APP_NAME: "Brandinstock CRM"
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?APP_KEY mancante}
  APP_PREVIOUS_KEYS: ${APP_PREVIOUS_KEYS:-}
  APP_URL: https://${APP_DOMAIN}
  APP_LOCALE: it
  LOG_CHANNEL: stderr
  LOG_LEVEL: warning
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: "5432"
  DB_DATABASE: ${DB_DATABASE:-brandinstock_crm}
  DB_USERNAME: ${DB_USERNAME:-crm_app}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD mancante}
  DB_SSLMODE: disable # traffico solo sulla rete Docker interna, mai su Internet
  SESSION_DRIVER: database
  SESSION_LIFETIME: "120"
  SESSION_ENCRYPT: "true"
  SESSION_SECURE_COOKIE: "true"
  SESSION_SAME_SITE: strict
  SESSION_COOKIE: __Host-crm_session
  SANCTUM_STATEFUL_DOMAINS: ${APP_DOMAIN}
  CACHE_STORE: database
  QUEUE_CONNECTION: sync
  MAIL_MAILER: ${MAIL_MAILER:-log}
  BCRYPT_ROUNDS: "12"
  TRUSTED_PROXIES: 172.16.0.0/12
  CRM_REQUIRE_2FA_ROLES: ${CRM_REQUIRE_2FA_ROLES:-admin,manager}
  CRM_BLIND_INDEX_KEY: ${CRM_BLIND_INDEX_KEY:?CRM_BLIND_INDEX_KEY mancante}

services:
  caddy:
    <<: *hardening
    build:
      context: ..
      dockerfile: deploy/caddy/Dockerfile
    image: brandinstock-crm-web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN mancante}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL mancante}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    networks: [edge, backend]
    depends_on:
      app:
        condition: service_started

  app:
    <<: *hardening
    build: ../backend
    image: brandinstock-crm-app
    environment: *app-env
    volumes:
      - app_storage:/var/www/html/storage
    read_only: true
    tmpfs:
      - /tmp
      - /var/www/html/bootstrap/cache:uid=82,gid=82,mode=0700
    cap_drop: [ALL]
    networks: [backend, db, egress]
    depends_on:
      db:
        condition: service_healthy

  # Migration con il ruolo proprietario dello schema; non gira in modo permanente:
  #   docker compose run --rm migrate
  migrate:
    image: brandinstock-crm-app
    profiles: [tools]
    environment:
      <<: *app-env
      DB_MIGRATION_USERNAME: ${DB_MIGRATION_USERNAME:-crm_owner}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?DB_MIGRATION_PASSWORD mancante}
    command: ["php", "artisan", "migrate", "--database=pgsql_migrations", "--force"]
    read_only: true
    tmpfs:
      - /tmp
      - /var/www/html/bootstrap/cache:uid=82,gid=82,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [db]
    depends_on:
      db:
        condition: service_healthy

  db:
    <<: *hardening
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-brandinstock_crm}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD mancante}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256 --data-checksums
      DB_USERNAME: ${DB_USERNAME:-crm_app}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_MIGRATION_USERNAME: ${DB_MIGRATION_USERNAME:-crm_owner}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD}
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_min_duration_statement=2000
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [db]

networks:
  edge: {}
  egress: {}          # uscita verso Internet per l'app (es. controllo password compromesse)
  backend:
    internal: true    # Caddy ↔ PHP-FPM
  db:
    internal: true    # PHP-FPM ↔ PostgreSQL, nessun accesso a Internet

volumes:
  pg_data:
  app_storage:
  caddy_data:
  caddy_config:
